name: Update profile art

# Refreshes contribution graph, streak visualization, and snake SVG daily from real GitHub data.
# Runs automatically every 6 hours, on push to main, and on manual workflow_dispatch.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real contribution data
        env:
          GH_PROFILE_USER: Hemanth27-DP
        run: python scripts/fetch_contributions.py

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Hemanth27-DP
          outputs: |
            svgs/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enhance Snake Animation
        env:
          GH_PROFILE_USER: Hemanth27-DP
        run: python scripts/enhance_snake.py

      - name: Render animated contribution heatmap SVG
        run: python scripts/generate_streak_svg.py Hemanth27-DP svgs/contrib-heatmap.svg

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art & contribution metrics [skip ci]"
          file_pattern: "README.md data/contributions.json svgs/contrib-heatmap.svg svgs/github-snake-dark-enhanced.svg"
