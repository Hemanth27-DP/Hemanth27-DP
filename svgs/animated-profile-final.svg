<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 285" width="860" height="285">
  <defs>
    <!-- Sequential Typewriter Clip Paths via SMIL Animation -->
    <clipPath id="p-l1"><rect x="0" y="-14" width="0" height="18"><animate attributeName="width" from="0" to="400" begin="0.4s" dur="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="p-l2"><rect x="0" y="6" width="0" height="18"><animate attributeName="width" from="0" to="400" begin="0.9s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="p-l3"><rect x="0" y="28" width="0" height="18"><animate attributeName="width" from="0" to="400" begin="1.6s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="p-l4"><rect x="0" y="48" width="0" height="18"><animate attributeName="width" from="0" to="400" begin="2.1s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="p-l5"><rect x="0" y="68" width="0" height="18"><animate attributeName="width" from="0" to="400" begin="2.8s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="p-l6"><rect x="0" y="88" width="0" height="18"><animate attributeName="width" from="0" to="400" begin="3.7s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="p-l7"><rect x="0" y="108" width="0" height="18"><animate attributeName="width" from="0" to="400" begin="4.3s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="p-l8"><rect x="0" y="128" width="0" height="18"><animate attributeName="width" from="0" to="400" begin="4.9s" dur="0.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="p-l9"><rect x="0" y="152" width="0" height="18"><animate attributeName="width" from="0" to="400" begin="5.3s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="p-l10"><rect x="0" y="178" width="0" height="18"><animate attributeName="width" from="0" to="400" begin="5.9s" dur="0.01s" fill="freeze"/></rect></clipPath>

    <!-- Linear Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Subtle Orange Shield Glow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Terminal Styles */
    .terminal-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.2px; }
    .header-bar { fill: #161b22; }
    .text-code { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #c9d1d9; }
    
    /* Syntax Highlighting */
    .kw { fill: #ff7b72; font-weight: 600; }
    .str { fill: #a5d6ff; }
    .var { fill: #79c0ff; }
    .fn { fill: #d2a8ff; }
    .aws-hl { fill: #FF9900; font-weight: 600; }
    .success { fill: #3fb950; font-weight: 700; }
    
    /* Terminal Cursor */
    @keyframes blink { 
      0%, 50% { opacity: 1; } 
      51%, 100% { opacity: 0; } 
    }
    .cursor { fill: #FF9900; animation: blink 0.9s step-end infinite; }
    @keyframes showCursor { 0% { opacity: 0; } 100% { opacity: 1; } }
    .term-cursor { opacity: 0; animation: showCursor 0.05s forwards 6.0s; }

    /* Experience Card Styles */
    .section-lbl { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; fill: #FF9900; letter-spacing: 2.5px; font-weight: 700; }
    .company-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14.5px; fill: #ffffff; font-weight: 700; }
    .intern-badge { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #58a6ff; font-weight: 600; }
    .duration-tag { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #8b949e; text-anchor: end; }
    .bullet-txt { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; fill: #8b949e; }
    .bullet-arrow { fill: #58a6ff; font-weight: bold; }
    
    .edu-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13.5px; fill: #e6edf3; font-weight: 600; }
    .edu-sub { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #8b949e; }
  </style>

  <!-- ================= LEFT COLUMN: Terminal (420px) ================= -->
  <g transform="translate(0, 0)">
    <!-- Terminal Outer Frame -->
    <rect width="420" height="283" x="1" y="1" rx="8" class="terminal-bg"/>
    <rect width="420" height="30" x="1" y="1" rx="8" class="header-bar"/>
    <rect width="420" height="12" x="1" y="19" class="header-bar"/>
    <line x1="1" y1="31" x2="421" y2="31" stroke="#30363d" stroke-width="1.2" />
    
    <!-- MacOS / Linux Controls -->
    <circle cx="18" cy="16" r="4.5" fill="#ff5f56"/>
    <circle cx="33" cy="16" r="4.5" fill="#ffbd2e"/>
    <circle cx="48" cy="16" r="4.5" fill="#27c93f"/>
    <text x="210" y="20" class="text-code" fill="#8b949e" text-anchor="middle">cloud_security/profile.py</text>

    <!-- Typing Code Lines -->
    <g transform="translate(18, 52)" class="text-code">
      <!-- Line 1 -->
      <g clip-path="url(#p-l1)">
        <text y="0"><tspan class="kw">import</tspan> sys</text>
      </g>
      
      <!-- Line 2 -->
      <g clip-path="url(#p-l2)">
        <text y="20"><tspan class="kw">from</tspan> core <tspan class="kw">import</tspan> <tspan class="fn">CloudSecurityEngineer</tspan></text>
      </g>
      
      <!-- Line 3 -->
      <g clip-path="url(#p-l3)">
        <text y="42"><tspan class="var">hemanth</tspan> = <tspan class="fn">Engineer</tspan>(</text>
      </g>
      
      <!-- Line 4 -->
      <g clip-path="url(#p-l4)">
        <text y="62">    name=<tspan class="str">"Hemanth D.P."</tspan>,</text>
      </g>
      
      <!-- Line 5 -->
      <g clip-path="url(#p-l5)">
        <text y="82">    focus=[<tspan class="str">"Cloud Security"</tspan>, <tspan class="aws-hl">"AWS"</tspan>, <tspan class="str">"Blue Team"</tspan>],</text>
      </g>
      
      <!-- Line 6 -->
      <g clip-path="url(#p-l6)">
        <text y="102">    platform=<tspan class="aws-hl">"AWS"</tspan>,</text>
      </g>
      
      <!-- Line 7 -->
      <g clip-path="url(#p-l7)">
        <text y="122">    os=<tspan class="str">"Linux / Ubuntu"</tspan></text>
      </g>
      
      <!-- Line 8 -->
      <g clip-path="url(#p-l8)">
        <text y="142">)</text>
      </g>
      
      <!-- Line 9 -->
      <g clip-path="url(#p-l9)">
        <text y="166"><tspan class="var">hemanth</tspan>.<tspan class="fn">build</tspan>()</text>
      </g>
      
      <!-- Line 10: Deployed Success -->
      <g clip-path="url(#p-l10)">
        <text y="192"><tspan class="success">[SUCCESS]</tspan> Profile deployed.</text>
      </g>
      
      <!-- Blinking Terminal Cursor -->
      <rect x="202" y="181" width="6.5" height="13" class="cursor term-cursor"/>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: Experience & Education (430px) ================= -->
  <g transform="translate(438, 0)">
    <!-- Container Card -->
    <rect width="420" height="283" x="1" y="1" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>

    <!-- Header Section: EXPERIENCE -->
    <g transform="translate(20, 28)">
      <!-- Shield Icon in AWS Orange -->
      <path d="M 0 3 L 6 0 L 12 3 C 12 8 6 12 6 12 C 6 12 0 8 0 3 Z" fill="none" stroke="#FF9900" stroke-width="1.5" filter="url(#badgeGlow)"/>
      <text x="18" y="10" class="section-lbl">EXPERIENCE</text>
    </g>

    <!-- Company & Role -->
    <g transform="translate(20, 58)">
      <text x="0" y="12" class="company-title">VSecure Networks</text>
      <rect x="156" y="2" width="84" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="198" y="14" class="intern-badge" text-anchor="middle">SOC Intern</text>
      
      <text x="380" y="12" class="duration-tag">3-month internship</text>
    </g>

    <!-- Verified Conservative Bullets -->
    <g transform="translate(20, 94)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="bullet-txt"><tspan class="bullet-arrow">&gt;</tspan> SOC / Blue Team exposure</text>
      </g>
      <g transform="translate(0, 20)">
        <text x="0" y="0" class="bullet-txt"><tspan class="bullet-arrow">&gt;</tspan> Security monitoring and analysis</text>
      </g>
      <g transform="translate(0, 40)">
        <text x="0" y="0" class="bullet-txt"><tspan class="bullet-arrow">&gt;</tspan> Practical cybersecurity workflows</text>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="152" x2="400" y2="152" stroke="#21262d" stroke-width="1"/>

    <!-- Header Section: EDUCATION -->
    <g transform="translate(20, 178)">
      <!-- Academic Cap / Bookmark Icon -->
      <path d="M 0 3 L 6 0 L 12 3 L 6 6 Z M 2 5 L 2 9 C 2 9 6 11 10 9 L 10 5" fill="none" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="18" y="7" class="section-lbl" fill="#58a6ff">EDUCATION</text>
    </g>

    <!-- Degree Details -->
    <g transform="translate(20, 208)">
      <text x="0" y="8" class="edu-title">B.E. Computer Science Engineering</text>
      <text x="380" y="8" class="duration-tag">2023 — 2027</text>
      
      <text x="0" y="28" class="edu-sub">MNMJEC <tspan fill="#30363d">|</tspan> Final-Year CSE Student <tspan fill="#30363d">|</tspan> India</text>
    </g>

    <!-- Current Preparation Pill -->
    <g transform="translate(20, 256)">
      <rect width="380" height="18" rx="4" fill="#0d1117" stroke="#21262d" stroke-width="0.8"/>
      <circle cx="10" cy="9" r="2.5" fill="#FF9900"/>
      <text x="20" y="12.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5px" fill="#8b949e">Targeting AWS Cloud Practitioner &amp; Cloud Security Pathways</text>
    </g>
  </g>
</svg>
