<svg xmlns="http://www.w3.org/2000/svg" width="210" height="48" viewBox="0 0 210 48">
  <defs>
    <linearGradient id="btnBgLi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glowLi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .btn { fill: url(#btnBgLi); stroke: #30363d; stroke-width: 1.2px; transition: all 0.3s ease; cursor: pointer; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #c9d1d9; letter-spacing: 0.5px; pointer-events: none; transition: all 0.3s ease; }
    .icon { fill: #0a66c2; pointer-events: none; }
    .grp:hover .btn { stroke: #0a66c2; filter: url(#glowLi); }
    .grp:hover .txt { fill: #ffffff; }
  </style>
  <g class="grp">
    <rect x="2" y="2" width="206" height="44" rx="22" class="btn"/>
    <!-- LinkedIn Icon -->
    <svg x="18" y="14" width="20" height="20" viewBox="0 0 24 24">
      <path class="icon" d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.6a1.62 1.62 0 1 0 1.63 1.62A1.62 1.62 0 0 0 7.83 6.6z"/>
    </svg>
    <text x="50" y="28" class="txt">Connect on LinkedIn</text>
  </g>
</svg>