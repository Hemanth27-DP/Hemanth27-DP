<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" height="210">
  <defs>
    <!-- Background Technical Grid Pattern -->
    <pattern id="sec-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.75" opacity="0.25"/>
      <circle cx="24" cy="24" r="0.75" fill="#58a6ff" opacity="0.3"/>
    </pattern>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#0d1117" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Security Scan Beam Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FF9900" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFAE33" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Traveling Light Sweep on Name -->
    <linearGradient id="nameGlow" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#c9d1d9"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#FFAE33"/>
      <stop offset="52%" stop-color="#FF9900"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
      <animate attributeName="x1" values="-100%; 100%; -100%" dur="7s" repeatCount="indefinite" ease="easeInOut"/>
      <animate attributeName="x2" values="0%; 200%; 0%" dur="7s" repeatCount="indefinite" ease="easeInOut"/>
    </linearGradient>

    <!-- Underline Pulse Gradient -->
    <linearGradient id="linePulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#FF9900">
        <animate attributeName="stop-color" values="#FF9900; #58a6ff; #39d353; #FF9900" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soft Filter Glow -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleTextGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono-meta {
      font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 10px;
      fill: #8b949e;
      letter-spacing: 1.5px;
    }
    .status-badge {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #3fb950;
      letter-spacing: 1px;
    }
    .hero-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 10px;
      text-anchor: middle;
      fill: url(#nameGlow);
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.6));
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 5.5px;
      text-anchor: middle;
      fill: #8b949e;
    }
    .sub-accent {
      fill: #FF9900;
      font-weight: 700;
    }
    .tag-pill {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 9.5px;
      font-weight: 500;
      fill: #c9d1d9;
      letter-spacing: 1.2px;
    }

    /* Keyframe Animations */
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }
    .pulse-dot {
      transform-origin: center;
      transform-box: fill-box;
      animation: pulseDot 2s ease-in-out infinite;
    }

    @keyframes scanSweep {
      0% { transform: translateX(120px); opacity: 0; }
      10% { opacity: 0.8; }
      50% { opacity: 1; }
      90% { opacity: 0.8; }
      100% { transform: translateX(680px); opacity: 0; }
    }
    .scan-line {
      animation: scanSweep 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes reticleGlow {
      0%, 100% { stroke: #FF9900; opacity: 0.7; }
      50% { stroke: #58a6ff; opacity: 1; }
    }
    .reticle {
      animation: reticleGlow 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="858" height="208" x="1" y="1" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <rect width="856" height="206" x="2" y="2" rx="9" fill="url(#sec-grid)"/>
  <rect width="856" height="206" x="2" y="2" rx="9" fill="url(#ambientGlow)"/>

  <!-- Console Corner Reticles / Precision Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke-width="2" class="reticle"/>
  <path d="M 848 24 L 848 12 L 836 12" fill="none" stroke-width="2" class="reticle"/>
  <path d="M 12 186 L 12 198 L 24 198" fill="none" stroke-width="2" class="reticle"/>
  <path d="M 848 186 L 848 198 L 836 198" fill="none" stroke-width="2" class="reticle"/>

  <!-- Top Security HUD Header -->
  <g transform="translate(24, 28)">
    <!-- Status Indicator -->
    <circle cx="6" cy="0" r="3.5" fill="#3fb950" class="pulse-dot"/>
    <text x="16" y="3.5" class="status-badge">[SYSTEM: SECURE]</text>

    <!-- Center System Identifier -->
    <text x="406" y="3.5" class="mono-meta" text-anchor="middle">CLOUD_SEC::PROFILE_AUTH // AWS SOC CONSOLE</text>

    <!-- Right Side Badges -->
    <g transform="translate(680, -7)">
      <rect width="130" height="18" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <!-- Shield Icon in AWS Orange -->
      <path d="M 12 4 L 18 6.5 L 18 10 C 18 13.5 12 16 12 16 C 12 16 6 13.5 6 10 L 6 6.5 Z" fill="none" stroke="#FF9900" stroke-width="1.2"/>
      <text x="24" y="12" class="tag-pill" fill="#FF9900">AWS // BLUE TEAM</text>
    </g>
  </g>

  <!-- Divider Rule -->
  <line x1="24" y1="42" x2="836" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- Core Focal Display: HEMANTH D.P. -->
  <g transform="translate(0, 108)">
    <!-- Faint Encrypted Underlay for Tech Vibe -->
    <text x="430" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="39" font-weight="700" letter-spacing="10px" text-anchor="middle" fill="#21262d" opacity="0.3" select="none">HEMANTH D.P.</text>

    <!-- High-Impact Main Letterforms with Animated Gradient Sweep -->
    <text x="430" y="0" class="hero-name" xml:space="preserve">HEMANTH D.P.</text>

    <!-- Moving Laser Scan Line -->
    <g class="scan-line" opacity="0">
      <line x1="0" y1="-32" x2="0" y2="12" stroke="url(#scanBeam)" stroke-width="3.5" filter="url(#laserGlow)"/>
      <circle cx="0" cy="-10" r="2" fill="#FFAE33"/>
    </g>
  </g>

  <!-- Technical Animated Underline -->
  <g transform="translate(0, 128)">
    <line x1="280" y1="0" x2="580" y2="0" stroke="url(#linePulse)" stroke-width="1.5"/>
    <circle cx="430" cy="0" r="2.5" fill="#FF9900">
      <animate attributeName="r" values="2; 3.5; 2" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtitle -->
  <g transform="translate(0, 156)">
    <text x="430" y="0" class="subtitle">
      <tspan class="sub-accent">CLOUD SECURITY ENGINEER</tspan> IN THE MAKING
    </text>
  </g>

  <!-- Bottom Technical Badges / Status Bar -->
  <g transform="translate(0, 186)">
    <line x1="24" y1="-14" x2="836" y2="-14" stroke="#21262d" stroke-width="1"/>
    
    <g transform="translate(190, 0)">
      <circle cx="0" cy="-3" r="2" fill="#FF9900"/>
      <text x="10" y="0" class="mono-meta">AWS CLOUD ARCHITECTURE</text>
    </g>

    <g transform="translate(415, 0)">
      <circle cx="0" cy="-3" r="2" fill="#58a6ff"/>
      <text x="10" y="0" class="mono-meta">SOC / BLUE TEAM DEFENSE</text>
    </g>

    <g transform="translate(635, 0)">
      <circle cx="0" cy="-3" r="2" fill="#3fb950"/>
      <text x="10" y="0" class="mono-meta">LINUX &amp; DEV MINDSET</text>
    </g>
  </g>
</svg>
